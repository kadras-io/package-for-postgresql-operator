apiVersion: apps/v1
kind: Deployment
metadata:
  name: cnpg-controller-manager
spec:
  template:
    metadata:
      (annotations."prometheus.io/scrape" == null): true
      (annotations."prometheus.io/port" == null): true
    spec:
      (containers[?name == 'manager'] | [0]):
        (args[?starts_with(@, '--log-level=')]): [--log-level=debug]
