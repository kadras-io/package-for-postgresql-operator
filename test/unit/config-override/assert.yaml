apiVersion: v1
kind: ConfigMap
metadata:
  name: cnpg-controller-manager-config
data:
  CREATE_ANY_SERVICE: "true"
  KUBERNETES_CLUSTER_DOMAIN: example.local
  CLUSTERS_ROLLOUT_DELAY: "30"
  INSTANCES_ROLLOUT_DELAY: "10"
  ENABLE_INSTANCE_MANAGER_INPLACE_UPDATES: "true"
  INHERITED_ANNOTATIONS: categories,example.com/*
  INHERITED_LABELS: app,environment
  (PULL_SECRET_NAME == null): true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cnpg-controller-manager
spec:
  template:
    spec:
      (containers[?name == 'manager'] | [0]):
        (args[?starts_with(@, '--max-concurrent-reconciles=')]): [--max-concurrent-reconciles=20]
        (args[?starts_with(@, '--log-level=')]): [--log-level=trace]
        (contains(args, '--log-field-timestamp=timestamp')): true
        # The subcommand and the other upstream flags are kept.
        (args[0]): controller
        (contains(args, '--leader-elect')): true
