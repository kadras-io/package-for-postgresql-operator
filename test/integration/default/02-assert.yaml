---
# Uninstalling the package keeps the CustomResourceDefinitions, the namespace, and the PostgreSQL clusters with their data.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clusters.postgresql.cnpg.io
---
apiVersion: v1
kind: Namespace
metadata:
  name: cnpg-system
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-cluster
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pg-cluster-1
status:
  phase: Bound
---
apiVersion: v1
kind: Pod
metadata:
  name: pg-cluster-1
status:
  phase: Running
