---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-cluster
status:
  instances: 3
  readyInstances: 3
  phase: Cluster in healthy state
---
# The operator copied its image pull secret to the namespace of the Cluster.
apiVersion: v1
kind: Secret
metadata:
  name: pg-cluster-pull
type: kubernetes.io/dockerconfigjson
---
apiVersion: v1
kind: Secret
metadata:
  name: pg-cluster-app
---
# The `edit` role manages the PostgreSQL clusters, and only reads the resources managed by the operator.
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
commands:
  - script: test "$(kubectl auth can-i create clusters.postgresql.cnpg.io -n $NAMESPACE --as=developer)" = yes
  - script: test "$(kubectl auth can-i delete scheduledbackups.postgresql.cnpg.io -n $NAMESPACE --as=developer)" = yes
  - script: test "$(kubectl auth can-i list failoverquorums.postgresql.cnpg.io -n $NAMESPACE --as=developer)" = yes
  - script: test "$(kubectl auth can-i create failoverquorums.postgresql.cnpg.io -n $NAMESPACE --as=developer)" = no
