---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cnpg-controller-manager
  namespace: cnpg-system
status:
  readyReplicas: 1
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cnpg-controller-manager-config
  namespace: cnpg-system
data:
  PULL_SECRET_NAME: canonical-registry-credentials
---
apiVersion: v1
kind: Secret
metadata:
  name: canonical-registry-credentials
  namespace: cnpg-system
  annotations:
    secretgen.carvel.dev/image-pull-secret: ""
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: e30K
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cnpg-controller-manager
  namespace: cnpg-system
spec:
  template:
    spec:
      imagePullSecrets:
        - name: canonical-registry-credentials
