---
apiVersion: kapp.k14s.io/v1alpha1
kind: Config

minimumRequiredVersion: 0.50.0

#! Rebase rules specify how to merge the resources in the cluster with the ones being applied.
#! See more: https://carvel.dev/kapp/docs/latest/config/#rebaserules
rebaseRules:

#! The operator injects the CA of its admission webhooks at runtime (`MANAGE_WEBHOOK_CONFIGURATIONS`). Keep it.
- path: [webhooks, {allIndexes: true}, clientConfig, caBundle]
  type: copy
  sources: [new, existing]
  resourceMatchers:
  - apiVersionKindMatcher: {apiVersion: admissionregistration.k8s.io/v1, kind: MutatingWebhookConfiguration}
  - apiVersionKindMatcher: {apiVersion: admissionregistration.k8s.io/v1, kind: ValidatingWebhookConfiguration}

#! Some CRDs are too big for kapp to store the last applied configuration in an annotation, so kapp compares
#! them with the cluster state, where the API server sets a default conversion strategy. Keep it.
- path: [spec, conversion, strategy]
  type: copy
  sources: [new, existing]
  resourceMatchers:
  - apiVersionKindMatcher: {apiVersion: apiextensions.k8s.io/v1, kind: CustomResourceDefinition}
