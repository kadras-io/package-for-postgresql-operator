#@ load("/lib/validation.star", "is_dns_label")

#@data/values-schema
---

#@schema/desc "The namespace in which to deploy the CloudNativePG operator."
#@schema/validation ("a valid DNS label", is_dns_label), min_len=1, max_len=63
namespace: cnpg-system

#! =============================================
#! Operator
#! =============================================

#@schema/desc "The number of operator replicas. Additional replicas are standby via leader election, and all of them serve the admission webhooks. With more than 1 replica, a PodDisruptionBudget is created."
#@schema/validation min=1
replicas: 1

#@schema/desc "Container flags, merged on top of the ones computed by the package. Set a flag to null to remove it. See https://cloudnative-pg.io/docs/1.30/operator_conf."
#@schema/examples ("Concurrency", {"max-concurrent-reconciles": 20})
#@schema/type any=True
args: {}

#@schema/desc "Operator configuration, merged on top of the one computed by the package. Set an option to null to remove it. See https://cloudnative-pg.io/docs/1.30/operator_conf#available-options."
#@schema/examples ("Default PostgreSQL image", {"POSTGRES_IMAGE_NAME": "ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie"}), ("Cluster domain", {"KUBERNETES_CLUSTER_DOMAIN": "example.local"})
#@schema/type any=True
config: {}

#@schema/desc "Names of the annotations that, when set on a Cluster, are inherited by all the resources generated for it, including the Pods. Wildcards like `example.com/*` are supported."
inherited_annotations:
- ""

#@schema/desc "Names of the labels that, when set on a Cluster, are inherited by all the resources generated for it, including the Pods. Wildcards like `example.com/*` are supported."
inherited_labels:
- ""

#! =============================================
#! Upgrades
#! =============================================

#@schema/desc "Settings for the rollout of the PostgreSQL clusters after an operator upgrade."
upgrades:
  #@schema/desc "Seconds to wait between the rollouts of different PostgreSQL clusters."
  #@schema/validation min=0
  clusters_rollout_delay: 0
  #@schema/desc "Seconds to wait between the rollouts of the instances of the same PostgreSQL cluster."
  #@schema/validation min=0
  instances_rollout_delay: 0
  #@schema/desc "Whether to update the instance manager in place after an operator upgrade, without restarting the PostgreSQL instances."
  in_place_updates: false

#! =============================================
#! Observability
#! =============================================

#@schema/desc "Settings for logs and metrics."
observability:
  logging:
    #@schema/desc "The log level of the operator. The logs are always in JSON format."
    #@schema/validation one_of=["error", "warning", "info", "debug", "trace"]
    level: info
  metrics:
    #@schema/desc "Whether to annotate the operator Pods for Prometheus scraping. The operator always exposes metrics on port 8080 (`/metrics`)."
    enabled: true
