#! The permissions on the CloudNativePG resources, added to the Kubernetes default roles via aggregation, so that the
#! users bound to `admin`, `edit`, or `view` in a namespace can use them there. `view` is included in `edit`,
#! and `edit` in `admin`. The resources are listed explicitly, so that new ones are granted deliberately.
#! See: https://kubernetes.io/docs/reference/access-authn-authz/rbac/#aggregated-clusterroles

#! The PostgreSQL clusters of the namespace, with their databases, backups, and connection poolers.
#! The FailoverQuorums are managed by the operator.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: postgresql-operator-edit
  labels:
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
rules:
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters", "backups", "scheduledbackups", "poolers", "databases", "databaseroles", "publications", "subscriptions", "imagecatalogs"]
    verbs: ["create", "delete", "deletecollection", "patch", "update"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: postgresql-operator-view
  labels:
    rbac.authorization.k8s.io/aggregate-to-view: "true"
rules:
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters", "backups", "scheduledbackups", "poolers", "databases", "databaseroles", "publications", "subscriptions", "imagecatalogs", "failoverquorums"]
    verbs: ["get", "list", "watch"]
