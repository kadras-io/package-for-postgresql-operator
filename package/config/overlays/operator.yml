#@ load("@ytt:data", "data")
#@ load("@ytt:overlay", "overlay")
#@ load("/lib/cnpg.star", "args_merger", "config_name", "deployment", "operator_args", "operator_config", "operator_config_checksum", "selector")

#! The operator is configured via flags and via the `cnpg-controller-manager-config` ConfigMap, which it reads at startup.
#! The flags computed from the package values are merged into the upstream ones, then `args` is merged on top.
#! The configuration computed from the package values is merged with `config`. Its checksum rolls out the operator
#! when it changes, and kapp applies it before the operator starts.
#! See: https://cloudnative-pg.io/docs/1.30/operator_conf

#@ config_group = "postgresql-operator.packages.kadras.io/config"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: #@ config_name
  namespace: #@ data.values.namespace
  annotations:
    kapp.k14s.io/change-group: #@ config_group
data: #@ operator_config()

#@overlay/match by=overlay.subset({"kind":"Deployment", "metadata":{"name":deployment}})
---
metadata:
  #@overlay/match missing_ok=True
  annotations:
    #@overlay/match missing_ok=True
    kapp.k14s.io/change-rule: #@ "upsert after upserting " + config_group
spec:
  replicas: #@ data.values.replicas
  template:
    metadata:
      #@overlay/match missing_ok=True
      annotations:
        #@overlay/match missing_ok=True
        kadras.io/config-checksum: #@ operator_config_checksum()
    spec:
      containers:
        #@overlay/match by="name"
        - name: manager
          #@overlay/replace via=args_merger(operator_args())
          args:
          #! The images are referenced by digest, so they don't change between restarts.
          imagePullPolicy: IfNotPresent

#! The operator runs with leader election: additional replicas are standby, and all of them serve the admission webhooks.
#! With more than one replica, a PodDisruptionBudget keeps at least one available.
#! See: https://cloudnative-pg.io/docs/1.30/installation_upgrade#details-about-the-deployment

#@ if data.values.replicas > 1:
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: #@ deployment
  namespace: #@ data.values.namespace
  labels: #@ selector
spec:
  minAvailable: 1
  selector:
    matchLabels: #@ selector
#@ end
